name: via_mallorca
description: An open source app for tracking Mallorca Transit.
publish_to: "none"
version: 1.7.0+13

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  mallorca_transit_services: ^2.4.0
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_local_notifications: ^21.0.0
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  permission_handler: ^12.0.1
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  syncfusion_flutter_pdfviewer: ^33.2.7
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  locale_names: ^1.1.1
  flutter_map_location_marker: ^10.2.0
  geolocator: ^14.0.2
  connectivity_plus: ^7.1.1
  flutter_map_animations: ^0.10.0
  timelines:
    git:
      url: https://github.com/quqo-dev/timelines.git
      ref: main
  flutter_material_design_icons: ^3.1.0+7447
  flutter_map_tile_caching: ^10.1.1
  path_provider: ^2.1.5
  flutter_map_cancellable_tile_provider: ^3.1.1
  numberpicker: ^2.1.2
  web_socket_channel: ^3.0.3
  quick_actions: ^1.1.0

dependency_overrides:
  intl: ^0.20.2 # Due to downstream dart_rss dependency of mallorca_transit_services
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
